[project]
name = "udemy-purchase-scraper"
version = "0.0.1"
description = "Scrapes Udemy for purchases"
authors = [
    {name = "Garrett Johnson",email = "pingujohnson@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fake-useragent>=2.2.0",
    "ipython>=9.17.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "selenium>=4.51.0",
    "undetected-chromedriver>=3.5.5"
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel"
]
